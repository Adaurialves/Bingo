<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#102f63"> 
    <title>Bingo - Alves Pro System</title>
    
    <!-- Biblioteca OCR para Inteligência Artificial -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #eef1f6;
            --primary: #102f63;
            --secondary: #3b71b8;
            --accent: #439a75;
            --called: #3b71b8;
            --last-called: #e67e22;
            --match: #439a75;
            --free: #f1c40f;
            --danger: #e74c3c;
            --warning: #f39c12;
            --winner-bg: #e8f5e9;
            --winner-border: #439a75;
            --camera: #8e44ad;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- LOGO TOPO --- */
        .logo-container {
            text-align: center;
            margin-bottom: 5px;
            width: 100%;
            max-width: 350px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .header-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        p.subtitle { margin: 0; color: #555; text-align: center; font-size: 15px; font-weight: 500;}

        .btn-reset {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 0 #c0392b;
        }
        .btn-reset:active { transform: translateY(2px); box-shadow: none; }

        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            align-items: flex-start;
        }

        /* --- PAINEL DE SORTEIO --- */
        .sidebar {
            flex: 0 0 380px;
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(16, 47, 99, 0.1);
            position: sticky;
            top: 15px;
            box-sizing: border-box;
            border-top: 6px solid var(--primary);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .sidebar-header h2 { margin: 0; font-size: 16px; color: var(--primary);}
        
        .round-badge {
            background: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .prize-board {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #d1d8e0;
        }

        .prize-board h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: var(--primary);
            text-align: center;
            text-transform: uppercase;
        }

        .prize-list-container {
            max-height: 140px;
            overflow-y: auto;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .prize-list-container::-webkit-scrollbar { width: 5px; }
        .prize-list-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 5px; }

        .prize-row {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 4px;
            transition: 0.2s;
        }

        .prize-row span {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            width: 40px;
            text-align: center;
        }

        .prize-row input {
            flex: 1;
            border: none;
            padding: 6px;
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
            background: transparent;
            outline: none;
        }

        .prize-row.active {
            border: 2px solid var(--accent);
            background: #e8f5e9;
            box-shadow: 0 2px 5px rgba(67, 154, 117, 0.2);
        }
        .prize-row.active span { color: var(--accent); }
        .prize-row.active input { color: #1e5e3f; }

        .game-mode {
            background: #f4f6f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #d1d8e0;
        }
        
        .game-mode label {
            display: block;
            margin: 5px 0;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .game-mode input[type="radio"] { transform: scale(1.2); margin-right: 8px; accent-color: var(--secondary);}

        /* ALERTA DE BINGO */
        #global-alert {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #2e7a5a);
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            display: none;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(67, 154, 117, 0.4);
            animation: pulse 1s infinite alternate;
            box-sizing: border-box;
            border: 2px solid #fff;
        }

        .alert-prize {
            display: block;
            font-size: 15px;
            margin-top: 8px;
            background: rgba(0,0,0,0.25);
            padding: 6px;
            border-radius: 6px;
            text-transform: uppercase;
            color: #ffeaa7;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        /* DISPLAY DE INFORMAÇÕES */
        .last-called-display {
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .info-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .info-label {
            font-size: 12px;
            font-weight: normal;
            color: #d1d8e0;
            text-transform: uppercase;
        }

        .called-count-badge {
            background: var(--secondary);
            padding: 4px 15px;
            border-radius: 6px;
            font-size: 24px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .last-num-badge {
            font-size: 24px;
            color: var(--last-called);
            background: white;
            padding: 4px 15px;
            border-radius: 6px;
            min-width: 30px;
            text-align: center;
            font-weight: bold;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-bottom: 15px;
        }

        /* NÚMEROS DE SORTEIO MAIORES */
        .num-btn {
            padding: 12px 0;
            font-size: 18px;
            border: 1px solid #cdd6e0;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 900;
            color: var(--primary);
            box-shadow: 0 2px 0 #d1d8e0;
        }

        .num-btn:active { transform: translateY(2px); box-shadow: 0 0 0 transparent; }
        
        .num-btn.called {
            background: var(--called);
            color: white;
            border-color: #2b568c;
            box-shadow: 0 2px 0 #2b568c;
        }

        .num-btn.last-called {
            background: var(--last-called) !important;
            border-color: #ba6013 !important;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.6) !important;
            transform: scale(1.15) translateY(-2px);
            z-index: 10;
            position: relative;
            color: white;
        }

        .btn-large {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.1s;
        }
        .btn-large:active { transform: translateY(3px); box-shadow: 0 0 0 transparent !important; }
        
        .btn-add { background: var(--secondary); box-shadow: 0 3px 0 #2b568c; margin-bottom: 10px;}
        .btn-camera { background: var(--camera); box-shadow: 0 3px 0 #6c3483; margin-bottom: 10px;}
        
        .round-controls {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-prev-round { background: #7f8c8d; box-shadow: 0 3px 0 #636e72; }
        .btn-next-round { background: var(--warning); box-shadow: 0 3px 0 #d68910; color: #111;}

        /* --- ÁREA DAS CARTELAS --- */
        .cards-area {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .card-wrapper {
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(16, 47, 99, 0.08);
            width: 300px;
            border: 3px solid transparent;
            box-sizing: border-box;
        }

        .card-wrapper.winner {
            border-color: var(--winner-border);
            background-color: var(--winner-bg);
            box-shadow: 0 0 20px rgba(67, 154, 117, 0.5);
            transform: scale(1.02);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 2px solid #eef1f6;
            padding-bottom: 5px;
        }
        
        .card-header h3 { margin: 0; font-size: 18px; color: var(--primary); font-weight: 800;}
        .card-actions button {
            background: none; border: none; cursor: pointer; color: #7f8c8d; font-size: 12px; margin-left: 2px;
            font-weight: bold;
        }
        .card-actions button:hover { color: var(--danger); }

        .bingo-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 4px;
            color: var(--primary);
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .bingo-grid input {
            width: 100%;
            height: 45px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #e1e5eb;
            border-radius: 4px;
            box-sizing: border-box;
            background: #fff;
            padding: 0;
            color: var(--primary);
        }

        .bingo-grid input:focus { outline: none; border-color: var(--secondary); background: #f4f8ff;}

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .matched { background-color: var(--match) !important; color: white !important; border-color: #2e7a5a !important; }

        /* ESTILO DO ESPAÇO CENTRAL COM A LOGO */
        .free-space {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff !important; 
            cursor: not-allowed;
            border: 2px solid #e1e5eb !important;
            border-radius: 4px;
            padding: 2px;
            box-sizing: border-box;
            height: 45px;
        }
        
        .free-space.matched {
            background-color: #ffffff !important; 
            border-color: #e1e5eb !important;
        }

        .free-space img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .card-counter { font-size: 14px; color: var(--primary); text-align: center; margin-top: 5px; font-weight: bold;}

        #scan-status {
            text-align: center;
            font-weight: bold;
            color: var(--camera);
            margin-bottom: 10px;
            display: none;
            background: #f4e6fa;
            padding: 8px;
            border-radius: 6px;
        }

        /* --- CSS DO SCANNER PROFISSIONAL --- */
        .camera-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .camera-header-modal {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            background: #111;
        }

        .camera-header-modal h3 { color: white; margin: 0; font-size: 16px; }
        .camera-header-modal button { background: none; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 16px;}

        .video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #video-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* O quadrado guia para o usuário colocar a cartela */
        .scanner-guide {
            position: absolute;
            width: 85%;
            height: 60%;
            border: 3px solid rgba(67, 154, 117, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.6); 
            display: flex;
            justify-content: center;
        }

        /* Linha animada tipo leitor de código de barras */
        .scanner-line {
            width: 100%;
            height: 3px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: scan 2.5s infinite linear;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            50% { transform: translateY(1000%); } 
            100% { transform: translateY(0); }
        }

        .btn-capture {
            width: 90%;
            max-width: 400px;
            padding: 18px;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(67, 154, 117, 0.5);
        }
        .btn-capture:active { transform: scale(0.95); }
        .btn-capture:disabled { background: #7f8c8d; box-shadow: none; transform: none; cursor: not-allowed; }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; flex: none; position: static; }
            .cards-area { width: 100%; }
            .card-wrapper { width: 100%; max-width: 380px; }
            .numbers-grid { grid-template-columns: repeat(10, 1fr); gap: 2px;}
            .num-btn { padding: 10px 0; font-size: 16px;} 
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" alt="Alves Pro System Logo">
        <h1 style="margin:0; font-size:24px; color:var(--primary); font-weight:900;">ALVES PRO SYSTEM</h1>
    </div>
    
    <div class="header-controls">
        <p class="subtitle">Gerenciador Profissional de Rodadas e Cartelas</p>
        <button class="btn-reset" onclick="resetSystem()">Zerar Tudo</button>
    </div>

    <div class="main-layout">
        
        <div class="sidebar">
            
            <div class="sidebar-header">
                <h2>Controle de Sorteio</h2>
                <div class="round-badge" id="round-display">Rodada 1</div>
            </div>

            <div class="prize-board">
                <h3>🏆 Prêmios por Rodada</h3>
                <div class="prize-list-container" id="prize-list"></div>
            </div>

            <div class="game-mode">
                <label><input type="radio" name="gamemode" value="linha" checked onchange="saveAndCheck()"> Linha / Coluna / Diagonal</label>
                <label><input type="radio" name="gamemode" value="cheia" onchange="saveAndCheck()"> Cartela Cheia</label>
            </div>

            <div id="global-alert">🎉 BINGO! TEMOS VENCEDOR! 🎉</div>

            <div class="last-called-display">
                <div class="info-group">
                    <span class="info-label">Bolas Chamadas</span>
                    <span class="called-count-badge" id="balls-count-text">0</span>
                </div>
                <div class="info-group">
                    <span class="info-label">Última Pedra</span>
                    <span class="last-num-badge" id="last-called-text">-</span>
                </div>
            </div>

            <div class="numbers-grid" id="caller-board"></div>
            
            <button class="btn-large btn-camera" onclick="openCameraScanner()">📷 Escanear Cartela Profissional</button>
            <div id="scan-status">Aguarde... Lendo cartela...</div>

            <button class="btn-large btn-add" onclick="addCardUI()">+ Digitar Cartela Manual</button>
            
            <div class="round-controls">
                <button class="btn-large btn-prev-round" onclick="prevRound()">⬅️ Voltar Rodada</button>
                <button class="btn-large btn-next-round" onclick="nextRound()">Avançar Rodada ⏭️</button>
            </div>
            
            <div class="card-counter" id="card-counter-text">0 / 30 Cartelas</div>
        </div>

        <div class="cards-area" id="cards-container"></div>

    </div>

    <!-- MODAL DA CÂMERA PROFISSIONAL -->
    <div id="camera-modal" class="camera-modal">
        <div class="camera-header-modal">
            <h3>Alinhe SÓ A GRADE no quadro</h3>
            <button onclick="closeCameraScanner()">❌ Fechar</button>
        </div>
        <div class="video-container">
            <video id="video-stream" autoplay playsinline></video>
            <div class="scanner-guide">
                <div class="scanner-line"></div>
            </div>
        </div>
        <button class="btn-capture" onclick="captureAndProcess()">📸 Capturar Imagem</button>
        <canvas id="hidden-canvas" style="display:none;"></canvas>
    </div>

    <script>
        const callerBoard = document.getElementById('caller-board');
        const cardsContainer = document.getElementById('cards-container');
        const globalAlert = document.getElementById('global-alert');
        const counterText = document.getElementById('card-counter-text');
        const lastCalledText = document.getElementById('last-called-text');
        const ballsCountText = document.getElementById('balls-count-text');
        const roundDisplay = document.getElementById('round-display');
        const prizeListContainer = document.getElementById('prize-list');
        
        let calledNumbers = new Set();
        let callHistory = []; 
        let allCards = []; 
        let nextCardIndex = 0; 
        const MAX_CARDS = 30; 
        let currentRound = 1;
        let roundsData = {};

        // --- SISTEMA DE AUTO-SAVE (NÃO PERDE DADOS AO ATUALIZAR) ---
        function persistData() {
            saveCurrentRoundState(); 
            const dataToSave = {
                currentRound: currentRound,
                nextCardIndex: nextCardIndex,
                roundsData: roundsData,
                gameMode: document.querySelector('input[name="gamemode"]:checked').value
            };
            localStorage.setItem('alvesBingoData', JSON.stringify(dataToSave));
        }

        function loadPersistedData() {
            const saved = localStorage.getItem('alvesBingoData');
            if (saved) {
                const data = JSON.parse(saved);
                currentRound = data.currentRound || 1;
                nextCardIndex = data.nextCardIndex || 0;
                roundsData = data.roundsData || {};
                
                if(data.gameMode) {
                    document.querySelector(`input[name="gamemode"][value="${data.gameMode}"]`).checked = true;
                }
                return true; 
            }
            return false; 
        }

        function resetSystem() {
            if(confirm("ATENÇÃO: Isso apagará todas as cartelas, rodadas e sorteios. Deseja começar um evento novo do zero?")) {
                localStorage.removeItem('alvesBingoData');
                location.reload();
            }
        }

        function saveAndCheck() {
            checkAllCards();
            persistData();
        }

        // --- INICIALIZAÇÃO ---
        function init() {
            createCallerBoard();
            createPrizeBoard(30); 
            
            loadPersistedData();
            loadRoundState(currentRound);
        }

        function createPrizeBoard(numRounds) {
            for(let i = 1; i <= numRounds; i++) addPrizeRow(i);
            updateActivePrizeRow();
        }

        function addPrizeRow(roundNum) {
            const row = document.createElement('div');
            row.className = 'prize-row';
            row.id = `prize-row-${roundNum}`;
            row.innerHTML = `
                <span>${roundNum}ª</span>
                <input type="text" id="prize-input-${roundNum}" placeholder="Ex: TV, Dinheiro..." oninput="persistData()">
            `;
            prizeListContainer.appendChild(row);
        }

        function updateActivePrizeRow() {
            document.querySelectorAll('.prize-row').forEach(row => row.classList.remove('active'));
            let activeRow = document.getElementById(`prize-row-${currentRound}`);
            if (!activeRow) {
                addPrizeRow(currentRound);
                activeRow = document.getElementById(`prize-row-${currentRound}`);
            }
            activeRow.classList.add('active');
            activeRow.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        function createCallerBoard() {
            for (let i = 1; i <= 75; i++) {
                const btn = document.createElement('button');
                btn.id = `num-btn-${i}`; 
                btn.className = 'num-btn';
                btn.textContent = i;
                btn.onclick = () => toggleCallNumber(i, btn);
                callerBoard.appendChild(btn);
            }
        }

        function toggleCallNumber(num, btn) {
            if (calledNumbers.has(num)) {
                calledNumbers.delete(num);
                btn.classList.remove('called');
                callHistory = callHistory.filter(n => n !== num);
            } else {
                calledNumbers.add(num);
                btn.classList.add('called');
                callHistory.push(num);
            }
            updateLastCalledUI(); 
            saveAndCheck(); 
        }

        function updateLastCalledUI() {
            document.querySelectorAll('.num-btn').forEach(btn => btn.classList.remove('last-called'));
            ballsCountText.textContent = calledNumbers.size;
            if (callHistory.length > 0) {
                const lastNum = callHistory[callHistory.length - 1];
                lastCalledText.textContent = lastNum;
                const lastBtn = document.getElementById(`num-btn-${lastNum}`);
                if (lastBtn) lastBtn.classList.add('last-called');
            } else {
                lastCalledText.textContent = '-';
            }
        }

        function getLetterName(num) {
            let letter = '';
            while (num >= 0) {
                letter = String.fromCharCode((num % 26) + 65) + letter;
                num = Math.floor(num / 26) - 1;
            }
            return letter;
        }

        function addCardUI(savedValues = null, savedName = null) {
            if (allCards.length >= MAX_CARDS) {
                alert(`Você atingiu o limite de ${MAX_CARDS} cartelas para esta rodada.`);
                return;
            }

            const name = savedName || `Cartela ${getLetterName(nextCardIndex)}`;
            const cardObj = { id: nextCardIndex, name: name, inputs: [], element: null };
            
            if (!savedName) nextCardIndex++;

            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            cardObj.element = wrapper;

            wrapper.innerHTML = `
                <div class="card-header">
                    <h3>${cardObj.name}</h3>
                    <div class="card-actions">
                        <button onclick="clearCard(${cardObj.id})">Limpar</button>
                        <button onclick="removeCard(${cardObj.id})">Excluir</button>
                    </div>
                </div>
                <div class="bingo-header">
                    <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
                </div>
            `;

            const grid = document.createElement('div');
            grid.className = 'bingo-grid';

            for (let i = 0; i < 25; i++) {
                if (i === 12) {
                    const freeSpace = document.createElement('div');
                    freeSpace.className = 'free-space matched'; 
                    freeSpace.innerHTML = '<img src="logo.png" alt="Logo">'; 
                    grid.appendChild(freeSpace);
                    cardObj.inputs.push(freeSpace);
                } else {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.min = 1;
                    input.max = 75;
                    let col = i % 5;
                    input.placeholder = `${col * 15 + 1}-${(col + 1) * 15}`; 
                    input.addEventListener('input', saveAndCheck); 
                    
                    if(savedValues && savedValues[i]) input.value = savedValues[i];
                    grid.appendChild(input);
                    cardObj.inputs.push(input);
                }
            }

            wrapper.appendChild(grid);
            cardsContainer.appendChild(wrapper);
            allCards.push(cardObj);
            updateCounter();
            saveAndCheck(); 
        }

        function removeCard(id) {
            const cardToRemove = allCards.find(c => c.id === id);
            if(confirm(`Excluir a ${cardToRemove.name}?`)) {
                const index = allCards.findIndex(c => c.id === id);
                if(index > -1) {
                    allCards[index].element.remove();
                    allCards.splice(index, 1);
                    updateCounter();
                    saveAndCheck(); 
                }
            }
        }

        function clearCard(id) {
            const card = allCards.find(c => c.id === id);
            if(card) {
                card.inputs.forEach((input, i) => {
                    if (i !== 12) { input.value = ''; input.classList.remove('matched'); }
                });
                saveAndCheck();
            }
        }

        function checkAllCards() {
            let winners = [];
            const gameMode = document.querySelector('input[name="gamemode"]:checked').value;

            allCards.forEach(card => {
                let hasWon = false;
                card.inputs.forEach((input, i) => {
                    if (i === 12) return; 
                    const val = parseInt(input.value);
                    if (val && calledNumbers.has(val)) input.classList.add('matched');
                    else input.classList.remove('matched');
                });

                const isMarked = (idx) => idx === 12 || card.inputs[idx].classList.contains('matched');

                if (gameMode === 'linha') {
                    for (let i = 0; i < 5; i++) if (isMarked(i*5) && isMarked(i*5+1) && isMarked(i*5+2) && isMarked(i*5+3) && isMarked(i*5+4)) hasWon = true;
                    for (let i = 0; i < 5; i++) if (isMarked(i) && isMarked(i+5) && isMarked(i+10) && isMarked(i+15) && isMarked(i+20)) hasWon = true;
                    if (isMarked(0) && isMarked(6) && isMarked(12) && isMarked(18) && isMarked(24)) hasWon = true;
                    if (isMarked(4) && isMarked(8) && isMarked(12) && isMarked(16) && isMarked(20)) hasWon = true;
                } else if (gameMode === 'cheia') {
                    let full = true;
                    for (let i = 0; i < 25; i++) {
                        if (i !== 12 && !isMarked(i)) { full = false; break; }
                    }
                    if (full) hasWon = true;
                }

                if (hasWon) {
                    card.element.classList.add('winner');
                    winners.push(card.name);
                } else {
                    card.element.classList.remove('winner');
                }
            });

            if (winners.length > 0) {
                let activePrizeInput = document.getElementById(`prize-input-${currentRound}`);
                let prizeText = activePrizeInput ? activePrizeInput.value.trim() : '';
                let prizeHTML = prizeText ? `<span class="alert-prize">Prêmio: <b>${prizeText}</b></span>` : '';
                globalAlert.innerHTML = `🎉 BINGO! Vencedor(es):<br><b>${winners.join(', ')}</b> 🎉 ${prizeHTML}`;
                globalAlert.style.display = 'block';
            } else {
                globalAlert.style.display = 'none';
            }
        }

        function saveCurrentRoundState() {
            roundsData[currentRound] = {
                called: Array.from(calledNumbers),
                history: [...callHistory],
                cards: allCards.map(c => {
                    const values = new Array(25).fill('');
                    c.inputs.forEach((input, i) => { if (i !== 12) values[i] = input.value; });
                    return { name: c.name, values: values };
                })
            };
        }

        function loadRoundState(roundNum) {
            cardsContainer.innerHTML = '';
            allCards = [];
            
            roundDisplay.textContent = `Rodada ${roundNum}`; 

            if (!roundsData[roundNum]) roundsData[roundNum] = { called: [], history: [], cards: [] };
            
            const data = roundsData[roundNum];
            calledNumbers = new Set(data.called);
            callHistory = [...data.history];

            document.querySelectorAll('.num-btn').forEach(btn => {
                const num = parseInt(btn.textContent);
                if (calledNumbers.has(num)) btn.classList.add('called');
                else btn.classList.remove('called');
            });

            if (data.cards.length > 0) {
                data.cards.forEach(c => addCardUI(c.values, c.name));
            } else {
                if (roundNum === 1 && Object.keys(roundsData).length <= 1) addCardUI(); 
            }
            
            updateLastCalledUI();
            checkAllCards();
        }

        function nextRound() {
            if(confirm(`Ir para a próxima rodada? Suas cartelas atuais serão salvas.`)) {
                currentRound++; 
                updateActivePrizeRow(); 
                loadRoundState(currentRound); 
                persistData();
            }
        }

        function prevRound() {
            if (currentRound > 1) {
                currentRound--;
                updateActivePrizeRow(); 
                loadRoundState(currentRound); 
                persistData();
            } else {
                alert("Você já está na primeira rodada!");
            }
        }

        function updateCounter() { counterText.textContent = `${allCards.length} / ${MAX_CARDS} Cartelas`; }

        // --- SISTEMA DE CÂMERA DE COORDENADA CRUZADA (INFALÍVEL) ---
        let videoStreamTrack = null;

        async function openCameraScanner() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('video-stream');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
                videoStreamTrack = stream.getTracks()[0];
                modal.style.display = 'flex';
            } catch (error) {
                alert("Erro ao acessar a câmera. Verifique as permissões do navegador (necessita HTTPS).");
            }
        }

        function closeCameraScanner() {
            const modal = document.getElementById('camera-modal');
            if (videoStreamTrack) videoStreamTrack.stop();
            modal.style.display = 'none';
        }

        function enhanceImageForOCR(ctx, width, height) {
            let imgData = ctx.getImageData(0, 0, width, height);
            let data = imgData.data;
            let totalBrightness = 0;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];
                let gray = (r * 0.299 + g * 0.587 + b * 0.114);
                data[i] = data[i+1] = data[i+2] = gray;
                totalBrightness += gray;
            }
            let avgBrightness = totalBrightness / (width * height);
            let threshold = avgBrightness * 0.85;
            for (let i = 0; i < data.length; i += 4) {
                let color = data[i] < threshold ? 0 : 255;
                data[i] = data[i+1] = data[i+2] = color;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        async function captureAndProcess() {
            const video = document.getElementById('video-stream');
            const guide = document.querySelector('.scanner-guide');
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const statusText = document.getElementById('scan-status');
            const btnCapture = document.querySelector('.btn-capture');

            let originalBtnText = btnCapture.textContent;
            btnCapture.textContent = "📷 Limpando e Analisando...";
            btnCapture.disabled = true;

            setTimeout(async () => {
                try {
                    const videoRect = video.getBoundingClientRect();
                    const guideRect = guide.getBoundingClientRect();
                    const scaleX = video.videoWidth / videoRect.width;
                    const scaleY = video.videoHeight / videoRect.height;

                    const cropX = (guideRect.left - videoRect.left) * scaleX;
                    const cropY = (guideRect.top - videoRect.top) * scaleY;
                    const cropWidth = guideRect.width * scaleX;
                    const cropHeight = guideRect.height * scaleY;

                    canvas.width = cropWidth * 2;
                    canvas.height = cropHeight * 2;

                    ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
                    enhanceImageForOCR(ctx, canvas.width, canvas.height);
                    
                    closeCameraScanner();
                    statusText.style.display = 'block';
                    statusText.textContent = "IA mapeando grade exata...";

                    const imageData = canvas.toDataURL('image/jpeg', 1.0);

                    const worker = await Tesseract.createWorker('eng');
                    await worker.setParameters({
                        tessedit_char_whitelist: '0123456789',
                        tessedit_pageseg_mode: '6', 
                    });

                    const result = await worker.recognize(imageData);
                    await worker.terminate(); 

                    if (!result || !result.data || !result.data.words) throw new Error("Nenhum número detectado.");

                    let validItems = [];

                    result.data.words.forEach(w => {
                        let text = w.text.trim(); 
                        if(text) {
                            let n = parseInt(text, 10);
                            if(n >= 1 && n <= 75) {
                                let cy = (w.bbox.y0 + w.bbox.y1) / 2; 
                                validItems.push({ number: n, cy: cy });
                            }
                        }
                    });

                    if (validItems.length > 0) {
                        
                        // Divide o espaço físico do quadrado verde da câmera em 5 LINHAS HORIZONTAIS
                        let rowHeight = canvas.height / 5;

                        let formattedCard = new Array(25).fill('');
                        let numbersAdded = 0;

                        validItems.forEach(item => {
                            let n = item.number;

                            // 1. ACHA A COLUNA PELO VALOR DO NÚMERO (INFAILÍVEL)
                            let col = -1;
                            if (n >= 1 && n <= 15) col = 0;
                            else if (n >= 16 && n <= 30) col = 1;
                            else if (n >= 31 && n <= 45) col = 2;
                            else if (n >= 46 && n <= 60) col = 3;
                            else if (n >= 61 && n <= 75) col = 4;

                            if (col !== -1) {
                                // 2. ACHA A LINHA PELA POSIÇÃO FÍSICA NO QUADRADO DA CÂMERA (INFAILÍVEL)
                                let row = Math.floor(item.cy / rowHeight);

                                // Travas de segurança
                                if (row < 0) row = 0;
                                if (row > 4) row = 4;

                                let index = row * 5 + col;

                                // Pula o Meio
                                if (index !== 12) {
                                    if (formattedCard[index] === '') {
                                        formattedCard[index] = n;
                                        numbersAdded++;
                                    }
                                }
                            }
                        });

                        let defaultName = `Cartela ${getLetterName(nextCardIndex)}`;
                        let customName = prompt("Cartela lida com sucesso! Digite um nome/número:", defaultName);
                        if (!customName || customName.trim() === '') customName = defaultName;

                        addCardUI(formattedCard, customName);
                        
                        if(numbersAdded === 24) {
                            alert("PERFEITO! Todos os números foram colocados nos seus lugares exatos.");
                        } else {
                            alert(`Foram colocados ${numbersAdded} números nos seus buracos corretos.\nOs números que faltaram na foto ficaram em branco. Complete tocando neles.`);
                        }

                    } else {
                        alert("Não foi possível ler os números. Enquadre a cartela no quadrado verde.");
                    }
                } catch (error) {
                    console.error(error);
                    alert("Erro na leitura. Tente alinhar a cartela e usar um local bem iluminado.");
                    closeCameraScanner();
                } finally {
                    statusText.style.display = 'none';
                    btnCapture.textContent = originalBtnText;
                    btnCapture.disabled = false;
                }
            }, 1000); 
        }

        init();
    </script>
